<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <title>In The Waves</title>
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center pb-4">
    <div class="card col-lg-6 col-sm-12 mt-5 px-0 shadow">
      <img src="img/wave.jpg" class="card-img-top cover" alt="Album art">

      <div class="card-body">
        <h5 class="card-title">In The Waves</h5>
        <p class="card-text">There's only one track. Press play and listen to the waves.</p>

        <audio id="player" src="audio/waves.mp3" preload="metadata"></audio>

        <div class="d-flex align-items-center gap-3 mb-2">
          <button class="btn btn-dark rounded-circle play-pause-btn" type="button" aria-label="Play">
            <span class="play-icon">&#9658;</span>
          </button>
          <span class="time-current">0:00</span>
          <div class="progress-bar-wrap flex-grow-1">
            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>
          </div>
          <span class="time-duration">0:00</span>
        </div>

        <div class="d-flex align-items-center gap-2 volume-wrap">
          <span class="volume-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/>
              <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/>
              <path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/>
            </svg>
          </span>
          <input type="range" class="form-range volume-slider" min="0" max="100" value="100">
        </div>
      </div>
    </div>
  </div>
  <div class="mobile-tooltip"></div>
<script src="js/script.js"></script>
</body>
</html>
