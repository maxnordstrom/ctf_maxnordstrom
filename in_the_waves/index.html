<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <title>In The Waves</title>
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center pb-4">
    <div class="card col-lg-6 col-sm-12 mt-5 px-0 shadow">
      <img src="img/album_art.png" class="card-img-top cover" alt="Album art">

      <div class="card-body">
        <h5 class="card-title">Now Playing</h5>
        <p class="card-text">One track, one server, one player. Press play and listen closely.</p>

        <audio id="player" src="audio/song.mp3" preload="metadata"></audio>

        <div class="d-flex align-items-center gap-3 mb-2">
          <button class="btn btn-dark rounded-circle play-pause-btn" type="button" aria-label="Play">
            <span class="play-icon">&#9658;</span>
          </button>
          <span class="time-current">0:00</span>
          <div class="progress-bar-wrap flex-grow-1">
            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>
          </div>
          <span class="time-duration">0:00</span>
        </div>

        <div class="d-flex align-items-center gap-2 volume-wrap">
          <span class="volume-icon">&#128266;</span>
          <input type="range" class="form-range volume-slider" min="0" max="100" value="100">
        </div>
      </div>
    </div>
  </div>
  <div class="mobile-tooltip"></div>
<script src="js/script.js"></script>
</body>
</html>
